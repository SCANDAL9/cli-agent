[project]
name = "cli-agent"
version = "0.1.0"
description = "Autonomous developer agent for workstation productivity using Vertex AI"
readme = "README.md"
authors = [
    { name = "cli-agent team" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.40",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
cli-agent = "cli_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
  --strict-markers
  --strict-config
  --tb=short
  --cov=src/cli_agent
  --cov-report=term-missing:skip-covered
  --cov-fail-under=85
"""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Fast isolated unit tests without network or filesystem side-effects",
    "integration: End-to-end Use Case tests tracing CU specifications",
    "slow: Tests with subprocesses or timing validations",
]

[tool.coverage.run]
branch = true
source = ["src/cli_agent"]
omit = ["src/cli_agent/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
